volumes:
  mariadb-data-principal:
  mariadb-data-replica:

services:
  mariadb-principal:
    image: mariadb:latest
    container_name: mariadb-principal
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: recipes
      MYSQL_TCP_PORT: 3307
    volumes:
      - mariadb-data-principal:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-P", "3307"]
      interval: 5s
      timeout: 3s
      retries: 20

  mariadb-replica:
    image: mariadb:latest
    container_name: mariadb-replica
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: recipes
      MYSQL_TCP_PORT: 3308
    volumes:
      - mariadb-data-replica:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-P", "3308"]
      interval: 5s
      timeout: 3s
      retries: 20

  nodo-principal:
    build: .
    container_name: nodo-principal
    network_mode: host
    environment:
      OLLAMA_HOST: "http://localhost:11434"
      NODE_ROLE: "main"
      REPLICA_URL: "http://localhost:8002"
      DB_HOST: "localhost"
      DB_PORT: "3307"
      DB_USER: "root"
      DB_PASSWORD: "rootpass"
      DB_NAME: "recipes"
    command: ["python", "-m", "src.server", "8001"]
    depends_on:
      mariadb-principal:
        condition: service_healthy

  nodo-replica:
    build: .
    container_name: nodo-replica
    network_mode: host
    environment:
      OLLAMA_HOST: "http://localhost:11434"
      NODE_ROLE: "replica"
      MAIN_URL: "http://localhost:8001"
      DB_HOST: "localhost"
      DB_PORT: "3308"
      DB_USER: "root"
      DB_PASSWORD: "rootpass"
      DB_NAME: "recipes"
    command: ["python", "-m", "src.server", "8002"]
    depends_on:
      mariadb-replica:
        condition: service_healthy

  balanceador:
    image: nginx:alpine
    container_name: balanceador
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nodo-principal
      - nodo-replica
